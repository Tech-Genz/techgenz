<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>TECH GENZ — Cinematic Portfolio | We Build What's Next</title>
    <meta name="description" content="Official portfolio of Tech Genz — a four-member technology studio engineering web applications, AI-powered systems, and experimental digital products." />
    <link rel="canonical" href="https://techgenz.site/" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://techgenz.site/" />
    <meta property="og:title" content="TECH GENZ — Cinematic Portfolio | We Build What's Next" />
    <meta property="og:description" content="Official portfolio of Tech Genz — a four-member technology studio engineering web applications, AI-powered systems, and experimental digital products." />
    <meta property="og:site_name" content="Tech Genz" />
    
    <!-- Twitter Meta -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://techgenz.site/" />
    <meta name="twitter:title" content="TECH GENZ — Cinematic Portfolio | We Build What's Next" />
    <meta name="twitter:description" content="Official portfolio of Tech Genz — a four-member technology studio engineering web applications, AI-powered systems, and experimental digital products." />
    
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <style>
      /* Prevent FOUC and set deep dark canvas */
      html, body {
        background-color: #050505;
        color: #F5F5F7;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
    </style>
  </head>
  <body class="bg-[#050505] text-[#F5F5F7] antialiased selection:bg-white selection:text-black min-h-screen">
    <div id="root"></div>

    <!-- 1. Development entrypoint: used by Vite dev server and Vite build -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- 2. Universal Static Hosting Fallback: if served directly by GitHub Pages branch deploy without Vite server -->
    <script type="module">
      setTimeout(() => {
        const root = document.getElementById('root');
        if (root && root.children.length === 0) {
          const loadCSS = (href) => {
            if (!document.querySelector(`link[href="${href}"]`)) {
              const link = document.createElement('link');
              link.rel = 'stylesheet';
              link.crossOrigin = '';
              link.href = href;
              document.head.appendChild(link);
            }
          };
          loadCSS('/assets/index.css');
          new Function("return import('/assets/index.js')")().catch(err => {
            console.error('Failed to load compiled production bundle:', err);
          });
        }
      }, 50);
    </script>
  </body>
</html>
